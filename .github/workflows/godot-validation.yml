name: Legacy Godot project validation

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "**/*.gd"
      - "tests/**/*.gd"
      - ".github/workflows/godot-validation.yml"
  pull_request:
    paths:
      - "project.godot"
      - "**/*.gd"
      - "tests/**/*.gd"
      - ".github/workflows/godot-validation.yml"

jobs:
  import-and-run:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit
      - name: Ensure Python is available
        run: apt-get update && apt-get install -y python3
      - name: Repository sanity checks
        run: python3 tests/repo_sanity.py
      - name: Run core logic tests
        run: godot --headless --path . --script tests/test_core_logic.gd
      - name: Run main scene briefly
        run: godot --headless --path . --quit-after 10
